<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <clipPath id="leftHalfFull">
      <rect x="0" y="0" width="180" height="360" />
    </clipPath>
    <clipPath id="rightHalfFull">
      <rect x="180" y="0" width="180" height="360" />
    </clipPath>
    
    <linearGradient id="orangeGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="greenGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B853" />
      <stop offset="100%" stop-color="#007A33" />
    </linearGradient>

    <linearGradient id="blueGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145BAE" />
      <stop offset="100%" stop-color="#083168" />
    </linearGradient>

    <linearGradient id="xOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>

  <!-- Embed Emblem Scaled on Left (at x=20, y=20, size=320x320) -->
  <g transform="translate(20, 20) scale(0.625)">
    <!-- Central Circular White Backdrop -->
    <circle cx="256" cy="256" r="162" fill="#FFFFFF" />

    <!-- Outer Gear Wheel -->
    <g clip-path="url(#leftHalfFull)">
      <path d="
        M 256,36 
        L 272,37 L 278,64 L 305,71 L 327,53 L 341,61 L 338,89 L 363,103 L 390,92 L 401,104 L 389,130 L 409,150 L 436,145 L 442,160 L 423,181 L 436,206 L 464,208 L 465,224 L 441,239 L 446,266 L 474,277 L 471,293 L 444,297 L 441,324 L 461,343 L 452,357 L 426,354 L 414,379 L 427,404 L 413,415 L 391,399 L 368,418 L 372,446 L 356,453 L 337,432 L 311,444 L 306,472 L 290,474 L 277,448 L 256,450 
        L 235,448 L 222,474 L 206,472 L 201,444 L 175,432 L 156,453 L 140,446 L 144,418 L 121,399 L 99,415 L 85,404 L 98,379 L 86,354 L 60,357 L 51,343 L 71,324 L 68,297 L 41,293 L 38,277 L 66,266 L 71,239 L 47,224 L 48,208 L 76,206 L 89,181 L 70,160 L 76,145 L 103,150 L 123,130 L 111,104 L 122,92 L 149,103 L 174,89 L 171,61 L 185,53 L 207,71 L 234,64 L 240,37 Z
        M 256,104
        A 152,152 0 1,0 256,408
        A 152,152 0 1,0 256,104 Z
      " fill-rule="evenodd" fill="url(#orangeGradFull)" />
    </g>

    <g clip-path="url(#rightHalfFull)">
      <path d="
        M 256,36 
        L 272,37 L 278,64 L 305,71 L 327,53 L 341,61 L 338,89 L 363,103 L 390,92 L 401,104 L 389,130 L 409,150 L 436,145 L 442,160 L 423,181 L 436,206 L 464,208 L 465,224 L 441,239 L 446,266 L 474,277 L 471,293 L 444,297 L 441,324 L 461,343 L 452,357 L 426,354 L 414,379 L 427,404 L 413,415 L 391,399 L 368,418 L 372,446 L 356,453 L 337,432 L 311,444 L 306,472 L 290,474 L 277,448 L 256,450 
        L 235,448 L 222,474 L 206,472 L 201,444 L 175,432 L 156,453 L 140,446 L 144,418 L 121,399 L 99,415 L 85,404 L 98,379 L 86,354 L 60,357 L 51,343 L 71,324 L 68,297 L 41,293 L 38,277 L 66,266 L 71,239 L 47,224 L 48,208 L 76,206 L 89,181 L 70,160 L 76,145 L 103,150 L 123,130 L 111,104 L 122,92 L 149,103 L 174,89 L 171,61 L 185,53 L 207,71 L 234,64 L 240,37 Z
        M 256,104
        A 152,152 0 1,0 256,408
        A 152,152 0 1,0 256,104 Z
      " fill-rule="evenodd" fill="url(#greenGradFull)" />
    </g>

    <!-- Speedlines & Flames -->
    <path d="M 175,170 A 130,130 0 0,0 148,310" fill="none" stroke="#0C448B" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10" />
    <path d="M 345,175 A 130,130 0 0,1 364,305" fill="none" stroke="#0C448B" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" />

    <path d="M 235,410 C 205,395 180,360 178,315 C 195,335 220,345 235,350 C 225,325 220,290 230,270 C 238,295 250,320 248,355 C 255,330 262,310 266,285 C 270,320 265,370 245,410 Z" fill="#FF8A00" />
    <path d="M 270,410 C 295,395 325,360 330,315 C 315,335 290,345 275,350 C 285,325 292,290 282,270 C 274,295 264,320 266,355 C 260,335 256,315 254,295 C 248,325 255,370 270,410 Z" fill="#00B853" />

    <!-- Rocket -->
    <g transform="translate(256, 250) rotate(18) translate(-256, -250)">
      <path d="M 218,275 L 180,335 L 224,320 Z" fill="#083168" />
      <path d="M 294,275 L 332,335 L 288,320 Z" fill="#083168" />
      <path d="
        M 256,70
        C 275,130 295,200 294,305
        C 280,315 232,315 218,305
        C 217,200 237,130 256,70 Z
      " fill="url(#blueGradFull)" stroke="#062248" stroke-width="3" />
      <circle cx="256" cy="170" r="22" fill="#FFFFFF" stroke="#083168" stroke-width="4" />
      <circle cx="256" cy="170" r="14" fill="#1976D2" />
      <circle cx="253" cy="167" r="5" fill="#FFFFFF" />
      <path d="M 235,305 L 230,320 L 282,320 L 277,305 Z" fill="#37474F" />
    </g>
  </g>

  <!-- Wordmark "NEXORA" -->
  <g transform="translate(370, 70)">
    <!-- Letter N -->
    <path d="M 0,140 L 0,0 L 32,0 L 80,88 L 80,0 L 112,0 L 112,140 L 80,140 L 32,52 L 32,140 Z" fill="#0A3B7B" />
    
    <!-- Letter E -->
    <path d="M 134,140 L 134,0 L 230,0 L 230,28 L 166,28 L 166,56 L 222,56 L 222,84 L 166,84 L 166,112 L 232,112 L 232,140 Z" fill="#0A3B7B" />

    <!-- Letter X (Stylized Orange to Blue Gradient) -->
    <g transform="translate(250, 0)">
      <path d="M 0,0 L 42,0 L 74,60 L 106,0 L 148,0 L 98,72 L 152,140 L 110,140 L 74,84 L 38,140 L -4,140 L 52,72 Z" fill="url(#xOrangeGrad)" />
    </g>

    <!-- Letter O (Stylized Sun / Crescent with Leaf Slash) -->
    <g transform="translate(420, 0)">
      <!-- Top Saffron Arc -->
      <path d="M 10,70 A 66,66 0 0,1 138,70 L 110,70 A 38,38 0 0,0 38,70 Z" fill="#FF8A00" />
      <!-- Bottom Green Arc -->
      <path d="M 10,70 A 66,66 0 0,0 138,70 L 110,70 A 38,38 0 0,1 38,70 Z" fill="#00A852" />
      <!-- Dynamic Diagonal Saffron Slash -->
      <path d="M -10,120 L 160,-20 L 120,40 L 30,130 Z" fill="#FF9100" opacity="0.9" />
    </g>

    <!-- Letter R -->
    <g transform="translate(585, 0)">
      <path d="M 0,140 L 0,0 L 64,0 C 94,0 114,16 114,44 C 114,64 100,78 78,84 L 120,140 L 82,140 L 46,90 L 32,90 L 32,140 Z M 32,28 L 32,64 L 62,64 C 76,64 82,58 82,46 C 82,34 76,28 62,28 Z" fill="#0A3B7B" />
    </g>

    <!-- Letter A -->
    <g transform="translate(720, 0)">
      <path d="M 52,0 L 88,0 L 140,140 L 104,140 L 90,102 L 50,102 L 36,140 L 0,140 Z M 58,74 L 82,74 L 70,36 Z" fill="#0A3B7B" />
    </g>

    <!-- Tagline: "Next Minds. Bold Innovations." -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#0A2A5E" letter-spacing="-0.5">
      Next Minds. Bold Innovations.
    </text>
  </g>
</svg>