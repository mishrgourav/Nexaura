<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Left Half Clip for Saffron Orange -->
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="256" height="512" />
    </clipPath>
    <!-- Right Half Clip for Emerald Green -->
    <clipPath id="rightHalf">
      <rect x="256" y="0" width="256" height="512" />
    </clipPath>
    <!-- Gear Shape Definition (12 mechanical cog teeth) -->
    <path id="gearPath" d="
      M 256,36 
      L 272,37 L 278,64 L 305,71 L 327,53 L 341,61 L 338,89 L 363,103 L 390,92 L 401,104 L 389,130 L 409,150 L 436,145 L 442,160 L 423,181 L 436,206 L 464,208 L 465,224 L 441,239 L 446,266 L 474,277 L 471,293 L 444,297 L 441,324 L 461,343 L 452,357 L 426,354 L 414,379 L 427,404 L 413,415 L 391,399 L 368,418 L 372,446 L 356,453 L 337,432 L 311,444 L 306,472 L 290,474 L 277,448 L 256,450 
      L 235,448 L 222,474 L 206,472 L 201,444 L 175,432 L 156,453 L 140,446 L 144,418 L 121,399 L 99,415 L 85,404 L 98,379 L 86,354 L 60,357 L 51,343 L 71,324 L 68,297 L 41,293 L 38,277 L 66,266 L 71,239 L 47,224 L 48,208 L 76,206 L 89,181 L 70,160 L 76,145 L 103,150 L 123,130 L 111,104 L 122,92 L 149,103 L 174,89 L 171,61 L 185,53 L 207,71 L 234,64 L 240,37 Z
      M 256,104
      A 152,152 0 1,0 256,408
      A 152,152 0 1,0 256,104 Z
    " fill-rule="evenodd" />

    <!-- Linear Gradients for depth -->
    <linearGradient id="orangeGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="greenGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B853" />
      <stop offset="100%" stop-color="#007A33" />
    </linearGradient>

    <linearGradient id="rocketBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145BAE" />
      <stop offset="50%" stop-color="#0C448B" />
      <stop offset="100%" stop-color="#083168" />
    </linearGradient>

    <linearGradient id="rocketHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="flameOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <linearGradient id="flameGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00897B" />
      <stop offset="50%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#B9F6CA" />
    </linearGradient>
  </defs>

  <!-- Central Circular White Backdrop -->
  <circle cx="256" cy="256" r="162" fill="#FFFFFF" />

  <!-- Outer Gear Wheel: Left Half Saffron Orange -->
  <g clip-path="url(#leftHalf)">
    <use href="#gearPath" fill="url(#orangeGearGrad)" />
  </g>

  <!-- Outer Gear Wheel: Right Half Emerald Green -->
  <g clip-path="url(#rightHalf)">
    <use href="#gearPath" fill="url(#greenGearGrad)" />
  </g>

  <!-- Inner Concentric Motion Streamline Arcs -->
  <!-- Left Blue Arc -->
  <path d="M 175,170 A 130,130 0 0,0 148,310" fill="none" stroke="#0C448B" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.85" />
  <!-- Right Blue Arc -->
  <path d="M 345,175 A 130,130 0 0,1 364,305" fill="none" stroke="#0C448B" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.85" />
  
  <!-- Dynamic Launch Blast Flames / Swooshes at Bottom -->
  <!-- Saffron Orange Flame Swirl (Left) -->
  <path d="M 235,410 C 205,395 180,360 178,315 C 195,335 220,345 235,350 C 225,325 220,290 230,270 C 238,295 250,320 248,355 C 255,330 262,310 266,285 C 270,320 265,370 245,410 Z" fill="url(#flameOrange)" />
  
  <!-- Emerald Green Flame Swirl (Right) -->
  <path d="M 270,410 C 295,395 325,360 330,315 C 315,335 290,345 275,350 C 285,325 292,290 282,270 C 274,295 264,320 266,355 C 260,335 256,315 254,295 C 248,325 255,370 270,410 Z" fill="url(#flameGreen)" opacity="0.95" />

  <!-- Core White & Cyan Exhaust Plume Behind Rocket Base -->
  <path d="M 242,390 C 235,350 245,310 256,280 C 267,310 277,350 270,390 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- The Rocket Ship (Surging Diagonally Up-Right ~ 20 Degrees) -->
  <g transform="translate(256, 250) rotate(18) translate(-256, -250)">
    <!-- Left Delta Fin -->
    <path d="M 218,275 L 180,335 L 224,320 Z" fill="#083168" />
    <path d="M 220,285 L 188,332 L 222,320 Z" fill="#145BAE" opacity="0.6" />

    <!-- Right Delta Fin -->
    <path d="M 294,275 L 332,335 L 288,320 Z" fill="#083168" />
    <path d="M 292,285 L 324,332 L 290,320 Z" fill="#145BAE" opacity="0.6" />

    <!-- Main Rocket Fuselage Body -->
    <path d="
      M 256,70
      C 275,130 295,200 294,305
      C 280,315 232,315 218,305
      C 217,200 237,130 256,70 Z
    " fill="url(#rocketBodyGrad)" stroke="#062248" stroke-width="3" />

    <!-- Rocket Leading Edge Specular Highlight -->
    <path d="
      M 256,78
      C 246,130 232,190 230,280
      C 226,240 234,150 252,90 Z
    " fill="url(#rocketHighlight)" />

    <!-- Porthole Window Outer White Ring -->
    <circle cx="256" cy="170" r="22" fill="#FFFFFF" stroke="#083168" stroke-width="4" />
    <!-- Porthole Window Inner Cyan/Blue Glass -->
    <circle cx="256" cy="170" r="14" fill="#1976D2" />
    <circle cx="253" cy="167" r="5" fill="#FFFFFF" opacity="0.85" />

    <!-- Rocket Engine Nozzle Base -->
    <path d="M 235,305 L 230,320 L 282,320 L 277,305 Z" fill="#37474F" />
  </g>
</svg>